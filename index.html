<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffc0d9, #ffe6f2);
    overflow: hidden;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

h1 { color: #ff4d88; }

button {
    font-size: 18px;
    padding: 12px 26px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

.yes { background: #ff4d88; color: white; }
.no  { background: #ffd1e8; }

#message {
    margin-top: 20px;
    font-size: 22px;
    color: #ff4d88;
}

/* hearts */
.heart {
    position: absolute;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div class="card">
<h1>Will you be my Valentine<br>pookie wookie sugar cookie? 💕</h1>

<button class="yes" id="yesBtn">Yes 💖</button>
<button class="no" id="noBtn">No</button>

<div id="message"></div>
</div>

<script>
const msg = document.getElementById("message");
const yes = document.getElementById("yesBtn");
const no = document.getElementById("noBtn");

no.onclick = () => {
    msg.textContent = "try again 💔";
};

yes.onclick = () => {
    msg.innerHTML = "YAYY!! 🎉💖<br>Happy Valentine Felida,<br>my pookie wookie 💕";
    confetti();
};

function confetti() {
    for (let i = 0; i < 80; i++) {
        const c = document.createElement("div");
        c.textContent = "🎉";
        c.style.position = "absolute";
        c.style.left = Math.random() * 100 + "vw";
        c.style.top = "-10px";
        document.body.appendChild(c);

        c.animate([
            { transform: "translateY(0)" },
            { transform: "translateY(110vh)" }
        ], { duration: 2000 });

        setTimeout(() => c.remove(), 2000);
    }
}
</script>

</body>
</html>
