<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💕</title>

<style>
    body {
        font-family: "Comic Sans MS", Arial, sans-serif;
        background: linear-gradient(135deg, #ffc0d9, #ffe6f2);
        overflow: hidden;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        z-index: 2;
    }

    h1 {
        color: #ff4d88;
        font-size: 26px;
    }

    button {
        font-size: 18px;
        padding: 12px 26px;
        margin: 10px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s;
    }

    button:hover {
        transform: scale(1.1);
    }

    .yes {
        background-color: #ff4d88;
        color: white;
    }

    .no {
        background-color: #ffd1e8;
        color: #333;
    }

    #message {
        margin-top: 20px;
        font-size: 22px;
        color: #ff4d88;
    }

    /* floating hearts */
    .heart {
        position: absolute;
        font-size: 20px;
        animation: floatUp 6s linear infinite;
        opacity: 0.8;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh); opacity: 1; }
        100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* confetti */
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: pink;
        animation: fall 3s linear forwards;
    }

        0% { transform: translateY(-10vh) rotate(0deg); }
